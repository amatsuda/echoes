name: Ruby

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: macos-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      # Let the other Ruby finish when one fails: both results are useful.
      fail-fast: false
      matrix:
        ruby:
          # 3.2 is the gemspec's minimum; 4.0 the development Ruby.
          # 3.4 is left out for now: rubish completion and rvim's `gg`
          # misbehave under it (tracked in those gems, not here).
          - '3.2'
          - '4.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
